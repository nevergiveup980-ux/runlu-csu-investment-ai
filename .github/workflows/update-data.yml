name: Refresh CSU research data
on:
  schedule:
    - cron: '17 */2 * * 1-5'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/update-data.mjs'
      - 'public/index.html'
permissions:
  contents: write
concurrency:
  group: refresh-csu-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "runlu-csu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Refresh CSU research data"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            if git push; then
              echo "Refresh data pushed successfully."
              exit 0
            fi
            sleep $((attempt * 8))
          done
          echo "Git push failed after 3 attempts."
          exit 1