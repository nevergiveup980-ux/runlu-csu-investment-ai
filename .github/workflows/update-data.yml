name: Refresh CSU research data
on:
  schedule:
    - cron: '17 */2 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "runlu-csu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "Refresh CSU research data"
          git push