name: Webull Sell Gate Tests

on:
  pull_request:
    paths:
      - 'webull-bot/**'
      - '.github/workflows/webull-sell-gate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run sell-gate unit tests
        run: python -m unittest discover -s webull-bot/tests -p 'test_*.py' -v
