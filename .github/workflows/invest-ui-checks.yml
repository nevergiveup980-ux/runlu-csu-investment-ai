name: RUNLU INVEST UI checks
on:
  push:
    branches: [runlu-invest-v0.1]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/invest-ui-smoke.mjs
      - run: node scripts/invest-ui-smoke.mjs
      - run: node --check scripts/invest-persistence-test.mjs
      - run: node scripts/invest-persistence-test.mjs
      - run: node --check scripts/invest-backup-validation-test.mjs
      - run: node scripts/invest-backup-validation-test.mjs
      - run: npm install
      - run: npm run typecheck
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser interaction test
        run: |
          python3 -m http.server 4173 --directory public > /tmp/invest-http.log 2>&1 &
          node scripts/invest-browser-test.mjs
          INVEST_BROWSER=webkit node scripts/invest-browser-test.mjs
      - name: Package isolated privacy-safe preview
        run: |
          mkdir -p invest-preview
          cp public/index.html invest-preview/index.html
          test "$(find invest-preview -type f | wc -l)" -eq 1
          test ! -e invest-preview/portfolio.json
          test ! -e invest-preview/data.json
      - name: Upload RUNLU INVEST preview
        uses: actions/upload-artifact@v4
        with:
          name: runlu-invest-safe-preview
          path: invest-preview/index.html
          if-no-files-found: error
          retention-days: 14
